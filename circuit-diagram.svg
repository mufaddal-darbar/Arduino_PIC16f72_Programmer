  <!-- ================= BUILD NOTES ================= -->
  <rect x="520" y="770" width="700" height="245" rx="6" fill="#fbfbef" stroke="#333" stroke-width="1.5"/>
  <text x="540" y="795" font-size="14" font-weight="bold" fill="#111">Build notes</text>
  <text x="540" y="822" font-size="12" fill="#111">&#8226; Q1 = any small NPN (BC547 / 2N2222).  Q2 = either of your PNPs (BC557 or 2N3906).</text>
  <text x="540" y="846" font-size="12" fill="#111">&#8226; Pinouts — flat face toward you, legs down:  BC557 = C-B-E   2N3906 = E-B-C   BC547 = C-B-E   2N2222 = E-B-C</text>
  <text x="540" y="870" font-size="12" fill="#111">&#8226; Set the boost to 13.2V and verify with a meter BEFORE wiring MCLR. VPP at pin 1 must stay within 12.75&#8211;13.25V.</text>
  <text x="540" y="894" font-size="12" fill="#111">&#8226; D9 HIGH = VPP on (~13V at MCLR)  ·  D9 LOW = VPP off. Onboard LED (D13) lights while VPP is on.</text>
  <text x="540" y="918" font-size="12" fill="#111">&#8226; All grounds common: Arduino GND, boost IN&#8722;/OUT&#8722;, Q1 emitter, R2, R6, PIC pins 8 &amp; 19.</text>
  <text x="540" y="942" font-size="12" fill="#111">&#8226; Program the bare chip (breadboard / socket). If it is in a circuit, isolate MCLR pull-ups and other VDD sources.</text>
  <text x="540" y="966" font-size="12" fill="#111">&#8226; VDD at PIC pin 20 must measure 4.75&#8211;5.25V. If USB power sags, feed the Arduino 7&#8211;9V on VIN instead.</text>
  <text x="540" y="990" font-size="12" fill="#111">&#8226; R5 = 100R current-limits VPP to ~130 mA (DS39588A note 1). R2 holds VPP off while the Arduino boots.</text>
</svg>
