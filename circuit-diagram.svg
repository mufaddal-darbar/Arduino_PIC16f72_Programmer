  <text x="640" y="56" text-anchor="middle" font-size="13" fill="#444">D9 HIGH = VPP ON (~13V on MCLR)  ·  D9 LOW = VPP OFF  ·  sketch pic16f72_icsp.ino (v2, two-transistor VPP switch)</text>

